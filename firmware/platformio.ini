; Duck Box firmware - PlatformIO project
;
; Build:   pio run
; Flash:   pio run -t upload
; Serial:  pio device monitor
;
; Versions are pinned on purpose so that a build next month is the same
; build as today.

[platformio]
default_envs = duckbox

[env:duckbox]
; espressif32 6.13.0 ships Arduino-ESP32 core 2.0.17 (ESP-IDF 4.4.7).
platform = espressif32@6.13.0
board = heltec_wifi_lora_32_V2
framework = arduino

; Run the CPU at 80 MHz instead of the board default of 240 MHz (battery
; life). The Arduino core applies this at start-up; setup() sets it again
; from CPU_FREQ_MHZ in include/config.h. Keep the two equal.
board_build.f_cpu = 80000000L

; The V2 board has 8 MB of flash, but this firmware needs well under 1 MB.
; Using the standard 4 MB layout means the same binary also starts on a
; board that turns out to have a 4 MB chip (an 8 MB image may refuse to boot
; there), and costs nothing on a real 8 MB board.
board_upload.flash_size = 4MB
board_build.partitions = default.csv

lib_deps =
    olikraus/U8g2@2.36.18

build_flags =
    -Wall
    -Wextra
    -DCORE_DEBUG_LEVEL=0

monitor_speed = 115200
; Do not hold the board in reset or in the bootloader while the serial
; monitor is open (DTR/RTS drive the auto-reset circuit on this board).
monitor_dtr = 0
monitor_rts = 0
upload_speed = 460800
